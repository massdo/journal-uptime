name: keepalive

# GitHub désactive les workflows planifiés d'un dépôt resté 60 jours sans activité.
# Une sonde qui s'éteint sans prévenir installe une fausse confiance : ce commit
# hebdomadaire maintient l'activité et rend l'extinction impossible en silence.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Marquer l'activite du depot
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat
          git commit -m "chore: keepalive"
          git push
